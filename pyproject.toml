[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "at2_ml_aas"
version = "0.0.1"
description = "ML models to forecast rain and precipitation."
authors = [
  { name = "Vaibhav Kiran Ghaisas" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "loguru",
    "mkdocs",
    "pip",
    "python-dotenv",
    "ruff",
    "tqdm",
    "typer",
    "scikit-learn (==1.5.1)",
    "jupyterlab (==4.4.4)",
    "pandas (==2.2.2)",
    "openmeteo-requests (>=1.7.2,<2.0.0)",
    "requests-cache (>=1.2.1,<2.0.0)",
    "retry-requests (>=2.0.0,<3.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "hyperopt (>=0.2.7,<0.3.0)",
    "hpsklearn (>=0.1.0,<0.2.0)",
    "setuptools (>=80.9.0,<81.0.0)",
    "ml-eval-viz (==0.4.0)",
    "xgboost (>=3.0.5,<4.0.0)",
    "scipy (>=1.16.2,<2.0.0)",
    "threadpoolctl (>=3.6.0,<4.0.0)",
    "requests (>=2.32.5,<3.0.0)",
]
requires-python = "==3.11.4"


[tool.ruff]
line-length = 99
src = ["at2_ml_aas"]
include = ["pyproject.toml", "at2_ml_aas/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["at2_ml_aas"]
force-sort-within-sections = true

